name: Security

on:
  pull_request:
  push:
    branches: [main, "claude/**"]

jobs:
  gitleaks:
    # Scans the full commit history for accidentally committed secrets.
    # Uses the gitleaks container directly (no third-party action) so the scan runs on private
    # repositories too, where gitleaks-action requires a license.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets
        run: docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:latest detect --source . --redact --no-banner
