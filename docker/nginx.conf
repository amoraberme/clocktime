# Spreads traffic across the two app instances, like Vercel's load balancer.
upstream clocktime {
  least_conn;
  # Never take an instance out for being slow (a nationwide export keeps it busy for seconds);
  # connection errors still fail over to the other one.
  server app1:3000 max_fails=0;
  server app2:3000 max_fails=0;
  keepalive 64;
  # Below Node's 5 s keep-alive, so nginx never reuses a connection the app just closed.
  keepalive_timeout 4s;
}

server {
  listen 80;
  # Photo uploads, terminal log batches and CSV imports
  client_max_body_size 20m;

  location / {
    proxy_pass http://clocktime;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Cron jobs and nationwide exports can run for minutes
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}
