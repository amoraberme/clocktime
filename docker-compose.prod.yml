# Local production copy of ClockTime: the same build and the same kind of services as the cloud
# setup (docs/deployment.md), on your own machine, for testing with 1,000+ users before migrating.
#
#   cp .env.prod.example .env.prod
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml run --rm seed        # 1,500 staff, 90 days
#   docker compose -f docker-compose.prod.yml run --rm loadtest    # shift-start rush
#
# App http://localhost:8080 · Mail http://localhost:8025 · Postgres localhost:5433
#
#   cloud                      here
#   Vercel instances           app1, app2 (behind nginx = Vercel's load balancer)
#   Vercel Cron                cron (reads vercel.json)
#   Neon pooled endpoint       pgbouncer (transaction mode)
#   Neon Postgres 16           postgres
#   Cloudflare R2              s3 (SeaweedFS, S3 API)
#   Resend                     mailpit (catches every email)

name: clocktime-prod

x-app: &app
  image: clocktime:local-prod
  build:
    context: .
    args:
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
      NEXT_PUBLIC_SALES_EMAIL: ${NEXT_PUBLIC_SALES_EMAIL:-}
  env_file: .env.prod
  restart: unless-stopped

services:
  postgres:
    image: postgres:16.15-alpine
    env_file: .env.prod
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - max_connections=200
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - effective_cache_size=2GB
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "5433:5432" # psql, pg_dump and `pnpm db:report` from your machine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  pgbouncer:
    build: ./docker/pgbouncer
    env_file: .env.prod
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  s3:
    image: chrislusf/seaweedfs:4.40
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -volume.max=0
    volumes:
      - s3data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "8333:8333" # signed download links (S3_PUBLIC_ENDPOINT) open from your browser
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.31.6
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
      MP_MAX_MESSAGES: "5000"
    ports:
      - "8025:8025" # inbox
    restart: unless-stopped

  migrate:
    <<: *app
    command: sh -c "pnpm exec prisma migrate deploy && pnpm exec tsx scripts/s3-init.ts"
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_started

  app1: &appsvc
    <<: *app
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_started
      mailpit:
        condition: service_started

  app2: *appsvc

  proxy:
    image: nginx:1.28.1-alpine
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    restart: unless-stopped

  cron:
    <<: *app
    command: pnpm exec tsx scripts/local-cron.ts --url http://proxy
    depends_on:
      proxy:
        condition: service_started

  # On-demand tools: docker compose -f docker-compose.prod.yml run --rm <name> [extra args]
  seed:
    <<: *app
    profiles: [tools]
    restart: "no"
    entrypoint: ["pnpm", "seed:scale"]
    command: ["--employees", "1500", "--days", "90"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  loadtest:
    <<: *app
    profiles: [tools]
    restart: "no"
    entrypoint: ["pnpm", "load:test", "run", "--url", "http://proxy", "--company", "scale-test"]
    command: ["--seconds", "300", "--fresh"]
    depends_on:
      proxy:
        condition: service_started

volumes:
  pgdata:
  s3data:
